name: KMP security checks

on:
  push:
    branches: [Liquid]
    paths:
      - "multiplatform/**"
      - ".github/workflows/kmp-security-check.yml"
  pull_request:
    paths:
      - "multiplatform/**"
      - ".github/workflows/kmp-security-check.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apple:
    name: iOS compile and macOS security tests
    runs-on: macos-26
    timeout-minutes: 60
    defaults:
      run:
        working-directory: multiplatform
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Select Xcode 26
        run: |
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          xcodebuild -version

      - name: Compile iOS and test macOS security paths
        run: |
          chmod +x ./gradlew
          ./gradlew :shared:iosSimulatorArm64Test :shared:desktopTest --stacktrace
