name: Build Debug APK

on:
  push:
    branches:
      - main
    paths-ignore:
      - "multiplatform/**"
      - "docs/**"
      - "**/*.md"
      - ".github/workflows/kmp-package.yml"
  workflow_dispatch:

concurrency:
  group: debug-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-debug-apk:
    name: Build Debug APK
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Use Google/Maven Central on GitHub runners
        run: python3 .github/ci/rewrite_ci_maven_repos.py

      - name: Build Debug APK
        run: ./gradlew assembleDebug --init-script .github/ci/github-maven-fallback.init.gradle.kts --stacktrace

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-arm64-v8a-debug.apk
