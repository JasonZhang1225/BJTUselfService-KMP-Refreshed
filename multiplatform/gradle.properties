org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
org.gradle.configuration-cache=true
org.gradle.caching=true
org.gradle.parallel=true

android.useAndroidX=true
kotlin.code.style=official

# Compose 1.12 alpha/beta 的 AAR 元数据要求 compileSdk 37，本机 SDK 最高 android-36.1；
# AGP 9.1 用该开关跳过此检查（旧 android.suppressUnsupportedCompileSdk 已失效），
# 不改 compileSdk/targetSdk。
android.experimental.disableCompileSdkChecks=true

# macOS 原生端（macosApp）用 Compose Multiplatform 的 macos 目标承载共享业务界面。
# 该目标在 Compose 1.12 仍是实验特性：Compose 侧没有现成的 ComposeUIViewController，
# macosMain 里自建 NSView 宿主（对标 ComposeWindow.macos.kt 的实现）。
# 升级 Compose 时先确认该开关与宿主实现是否仍成立。
org.jetbrains.compose.experimental.macos.enabled=true
