name: KMP package

on:
  push:
    tags:
      - "v*-KMP*"
  workflow_dispatch:

concurrency:
  group: kmp-package-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  GRADLE_OPTS: -Dorg.gradle.daemon=false

jobs:
  android:
    name: Android arm64 debug APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: multiplatform
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Restore Android upload keystore
        env:
          BJTU_ANDROID_KEYSTORE_BASE64: ${{ secrets.BJTU_ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$BJTU_ANDROID_KEYSTORE_BASE64" ]; then
            echo "Missing secret BJTU_ANDROID_KEYSTORE_BASE64"
            exit 1
          fi
          python3 - <<'PY'
          import base64, os, pathlib
          raw = os.environ["BJTU_ANDROID_KEYSTORE_BASE64"]
          path = pathlib.Path.home() / ".android" / "bjtu-kmp-upload.keystore"
          path.parent.mkdir(parents=True, exist_ok=True)
          path.write_bytes(base64.b64decode(raw))
          path.chmod(0o600)
          print(f"keystore_bytes={path.stat().st_size}")
          PY
          echo "BJTU_ANDROID_KEYSTORE=$HOME/.android/bjtu-kmp-upload.keystore" >> "$GITHUB_ENV"

      - name: Build arm64 debug APK
        env:
          BJTU_ANDROID_STORE_PASSWORD: ${{ secrets.BJTU_ANDROID_STORE_PASSWORD }}
          BJTU_ANDROID_KEY_ALIAS: ${{ secrets.BJTU_ANDROID_KEY_ALIAS }}
          BJTU_ANDROID_KEY_PASSWORD: ${{ secrets.BJTU_ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x ./gradlew
          ./gradlew :androidApp:assembleDebug --stacktrace

      - name: Rename APK
        id: artifact
        run: |
          VERSION="$(sed -n 's/.*CURRENT_VERSION = "\([^"]*\)".*/\1/p' shared/src/commonMain/kotlin/team/bjtuss/bjtuselfservice/shared/update/AppUpdateChecker.kt | head -n 1)"
          APK="$(find androidApp/build/outputs/apk/debug -type f -name '*-arm64-v8a-debug.apk' | head -n 1)"
          if [ -z "$APK" ]; then
            echo "arm64-v8a debug APK not found"
            find androidApp/build/outputs/apk/debug -type f -name '*.apk' -print
            exit 1
          fi
          test -n "$VERSION"
          test -f "$APK"
          NAME="BJTUSelfService-KMP-${VERSION}-arm64-v8a.apk"
          cp "$APK" "$NAME"
          echo "file=$NAME" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          ls -lh "$NAME"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: kmp-android-apk
          path: multiplatform/${{ steps.artifact.outputs.file }}
          if-no-files-found: error

  windows:
    name: Windows MSI
    runs-on: windows-latest
    defaults:
      run:
        working-directory: multiplatform
        shell: pwsh
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Check jpackage
        env:
          WINDOWS_PACKAGE_JAVA_HOME: ${{ env.JAVA_HOME }}
        run: |
          $jp = Join-Path $env:JAVA_HOME "bin\jpackage.exe"
          if (-not (Test-Path $jp)) { throw "jpackage missing: $jp" }
          Write-Host "jpackage=$jp"
          & $jp --version
          chcp 65001 | Out-Null

      - name: Build MSI
        env:
          WINDOWS_PACKAGE_JAVA_HOME: ${{ env.JAVA_HOME }}
          JAVA_TOOL_OPTIONS: -Dfile.encoding=UTF-8 -Dsun.jnu.encoding=UTF-8
        run: |
          chcp 65001 | Out-Null
          .\gradlew.bat :windowsApp:packageMsi --stacktrace

      - name: Print jpackage logs
        if: failure()
        run: |
          Get-ChildItem -Recurse "windowsApp\build\compose\logs","windowsApp\build\jpackage-shim" -Include *.txt,*.log -ErrorAction SilentlyContinue | ForEach-Object {
            Write-Host "===== $($_.FullName) ====="
            Get-Content -LiteralPath $_.FullName -ErrorAction SilentlyContinue
          }

      - name: Rename MSI
        id: artifact
        run: |
          $version = (Select-String -Path "shared\src\commonMain\kotlin\team\bjtuss\bjtuselfservice\shared\update\AppUpdateChecker.kt" -Pattern 'CURRENT_VERSION = "([^"]+)"').Matches[0].Groups[1].Value
          $msi = Get-ChildItem "windowsApp\build\compose\binaries\main\msi\*.msi" | Select-Object -First 1
          if (-not $msi) { throw "MSI not found" }
          $name = "BJTUselfServiceKMP-$version.msi"
          Copy-Item $msi.FullName $name
          "file=$name" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Get-Item $name | Format-List Name, Length, LastWriteTime

      - name: Upload MSI
        uses: actions/upload-artifact@v4
        with:
          name: kmp-windows-msi
          path: multiplatform/${{ steps.artifact.outputs.file }}
          if-no-files-found: error

  macos:
    name: macOS DMG
    runs-on: macos-15
    timeout-minutes: 60
    defaults:
      run:
        working-directory: multiplatform
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Build macOS DMG
        env:
          DESKTOP_PACKAGE_JAVA_HOME: ${{ env.JAVA_HOME }}
        run: |
          chmod +x ./gradlew
          ./gradlew :desktopApp:packageDmg --stacktrace

      - name: Rename DMG
        id: artifact
        run: |
          VERSION="$(sed -n 's/.*CURRENT_VERSION = "\([^"]*\)".*/\1/p' shared/src/commonMain/kotlin/team/bjtuss/bjtuselfservice/shared/update/AppUpdateChecker.kt | head -n 1)"
          DMG="$(find desktopApp/build/compose/binaries/main/dmg -name '*.dmg' | head -n 1)"
          test -n "$VERSION"
          test -f "$DMG"
          NAME="BJTUselfServiceKMP-${VERSION}.dmg"
          cp "$DMG" "$NAME"
          echo "file=$NAME" >> "$GITHUB_OUTPUT"
          ls -lh "$NAME"

      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: kmp-macos-dmg
          path: multiplatform/${{ steps.artifact.outputs.file }}
          if-no-files-found: error

  ios:
    name: iOS unsigned IPA
    # Compose 1.12 链接 UIViewLayoutRegion，需要 iOS 26 SDK / Xcode 26。
    runs-on: macos-26
    timeout-minutes: 90
    defaults:
      run:
        working-directory: multiplatform
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Select Xcode 26
        run: |
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Build unsigned iOS app
        env:
          JAVA_HOME: ${{ env.JAVA_HOME }}
        run: |
          chmod +x ./gradlew
          xcodebuild \
            -project iosApp/iosApp.xcodeproj \
            -scheme iosApp \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath iosApp/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package IPA
        id: artifact
        run: |
          VERSION="$(sed -n 's/.*CURRENT_VERSION = "\([^"]*\)".*/\1/p' shared/src/commonMain/kotlin/team/bjtuss/bjtuselfservice/shared/update/AppUpdateChecker.kt | head -n 1)"
          APP="$(find iosApp/DerivedData/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' | head -n 1)"
          test -n "$VERSION"
          test -d "$APP"
          NAME="BJTUSelfService-KMP-${VERSION}-iOS-unsigned.ipa"
          rm -rf ipa-stage
          mkdir -p ipa-stage/Payload
          APP_NAME="BJTUselfServiceKMP.app"
          cp -R "$APP" "ipa-stage/Payload/$APP_NAME"
          mv "ipa-stage/Payload/$APP_NAME/交大自由行 KMP" "ipa-stage/Payload/BJTUselfServiceKMP.app/BJTUselfServiceKMP"
          /usr/libexec/PlistBuddy -c 'Set :CFBundleExecutable BJTUselfServiceKMP' "ipa-stage/Payload/$APP_NAME/Info.plist"
          (cd ipa-stage && zip -qry "../$NAME" Payload)
          echo "file=$NAME" >> "$GITHUB_OUTPUT"
          ls -lh "$NAME"

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: kmp-ios-ipa
          path: multiplatform/${{ steps.artifact.outputs.file }}
          if-no-files-found: error

  release:
    name: GitHub Release
    needs: [android, windows, macos, ios]
    if: ${{ startsWith(github.ref, 'refs/tags/v') && needs.android.result == 'success' && needs.windows.result == 'success' && needs.macos.result == 'success' && needs.ios.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: kmp-*
          merge-multiple: true
          path: dist

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}：交大自由行 KMP 正式版
          prerelease: false
          fail_on_unmatched_files: false
          files: dist/*
          body: |
            ### 本版更新

            - 重做邮箱原生前端：宽屏支持文件夹、邮件列表、阅读区三栏布局，紧凑端使用平台原生二级页面。
            - 邮箱支持多个内置文件夹、分页、刷新、未读状态、附件元数据和结构化 HTML 表格正文显示。
            - 增加写信和回复首版，支持服务器草稿初始化、回复预填、正文编辑和发送前确认。
            - 优化物理在线作业状态：按北京时间区分已完成、未完成、逾期未交、逾期提交和截止时间未知，并以详情页明确提交信息为准。
            - Windows 触摸滚动兼容层收口为 Windows 专用；修复精密触摸板惯性导致课表重复翻页的问题。
            - 针对小米 HyperOS 高刷新率进行适配，清除错误的应用刷新率覆盖并关闭省电降帧干扰。
            - Android/iOS 宽屏课表改用跟手横向分页；首页同步失败支持查看模块状态并手动重试，异常作业响应不会覆盖有效缓存。
            - macOS DMG 保持中文应用/卷名称，并使用独立的安装卷图标资源。

            ### 版本

            - Android `1.7.5-KMP`（versionCode `16`，默认 `arm64-v8a`）
            - iOS `1.7.5-KMP`（Build `16`，未签名 IPA）
            - macOS / Windows 数值版本 `1.7.5`

            ### 安装说明

            | 文件 | 说明 |
            | --- | --- |
            | `BJTUSelfService-KMP-*-arm64-v8a.apk` | Android arm64-v8a，包名 `team.bjtuss.bjtuselfservice.kmp`。本地与 GitHub Actions 使用同一上传签名，可覆盖安装 |
            | `BJTUSelfService-KMP-*-iOS-unsigned.ipa` | iOS 未签名，需侧载自签 |
            | `BJTUselfServiceKMP-*.dmg` | macOS Apple Silicon |
            | `BJTUselfServiceKMP-*.msi` | Windows x64 系统级安装 |

            Windows 覆盖安装：先完全退出应用，不要先卸载（卸载会清登录）。若安装器只出现「修复/卸载」，请用：

            `msiexec /i 文件名.msi REINSTALL=ALL REINSTALLMODE=vomus`

            ### 已知限制

            - 非正式商店签名 / 未公证；iOS unsigned IPA 需自行签名侧载；Mac 版可能需执行 `sudo xattr -r -d com.apple.quarantine /Applications/交大自由行 KMP.app`
            - iOS unsigned IPA 需自行签名侧载，参考教程：[iOS 自签与安装指南](https://github.com/JasonZhang1225/BJTUselfService-KMP-Refreshed/blob/main/docs/iOS-sign-guide.md)
            - 物理在线的自动同步依赖校园网，离开校园网时只能读取已有缓存；真实文件提交仍需在可编辑作业上继续验收。
            - 邮箱写信/回复已完成协议和界面接入，但真实发送、删除、移动、转发及附件写操作仍需单独验收。
            - 小组件、系统通知等仍延后；Android 默认 APK 仅支持 `arm64-v8a`。
            - Windows MSI 使用同一 UpgradeCode，支持同为 `1.7.5` 的安装包覆盖升级；建议直接运行 MSI，不要先卸载。
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
