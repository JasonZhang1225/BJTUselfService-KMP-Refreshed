name: KMP security checks

on:
  push:
    branches: [main, audit]
    paths:
      - "multiplatform/**"
      - ".github/workflows/kmp-security-check.yml"
  pull_request:
    paths:
      - "multiplatform/**"
      - ".github/workflows/kmp-security-check.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    name: Android debug and optimized release checks
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        working-directory: multiplatform
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Create isolated compile-only signing fixture
        run: |
          keytool -genkeypair -noprompt -keystore "$RUNNER_TEMP/compile-only.keystore" \
            -storepass ci-compile-only -keypass ci-compile-only -alias ci-compile \
            -dname "CN=CI Compile Only" -keyalg RSA -keysize 2048 -validity 1

      - name: Build debug and optimized release APKs
        env:
          BJTU_ANDROID_KEYSTORE: ${{ runner.temp }}/compile-only.keystore
          BJTU_ANDROID_STORE_PASSWORD: ci-compile-only
          BJTU_ANDROID_KEY_ALIAS: ci-compile
          BJTU_ANDROID_KEY_PASSWORD: ci-compile-only
        run: |
          chmod +x ./gradlew
          ./gradlew :androidApp:assembleDebug :androidApp:assembleRelease --stacktrace

      - name: Inspect optimized APK contents and size
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile

          apks = list(Path("androidApp/build/outputs/apk/release").glob("*-arm64-v8a-release.apk"))
          assert len(apks) == 1, f"Expected one arm64 release APK, found {apks}"
          apk = apks[0]
          with ZipFile(apk) as archive:
              obsolete = [name for name in archive.namelist()
                          if name.lower().endswith((".onnx", ".pt", ".ptl"))
                          or "onnxruntime" in name.lower()
                          or "pytorch" in name.lower()]
          assert not obsolete, f"Obsolete captcha files in APK: {obsolete}"
          mapping = Path("androidApp/build/outputs/mapping/release/mapping.txt")
          assert mapping.is_file(), "R8 mapping missing: release was not minified"
          print(f"{apk.name}: {apk.stat().st_size:,} bytes ({apk.stat().st_size / 1024**2:.2f} MiB)")
          PY

      - name: Upload CI-only release APK and R8 reports
        uses: actions/upload-artifact@v4
        with:
          name: android-release-ci-only
          # This APK uses the disposable CI key, not the release upload key.
          path: |
            multiplatform/androidApp/build/outputs/apk/release/*.apk
            multiplatform/androidApp/build/outputs/mapping/release/
          if-no-files-found: error

  apple:
    name: iOS compile and macOS security tests
    runs-on: macos-26
    timeout-minutes: 60
    defaults:
      run:
        working-directory: multiplatform
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Select Xcode 26
        run: |
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          xcodebuild -version

      - name: Verify iOS minimum version
        run: |
          for configuration in Debug Release; do
            xcodebuild -project iosApp/iosApp.xcodeproj -scheme iosApp \
              -configuration "$configuration" -sdk iphonesimulator -showBuildSettings |
              grep -Eq '^[[:space:]]*IPHONEOS_DEPLOYMENT_TARGET = 18\.0$'
          done

      - name: Compile desktop test sources
        run: |
          chmod +x ./gradlew
          ./gradlew :shared:compileTestKotlinDesktop --stacktrace

      - name: Run macOS security tests
        run: ./gradlew :shared:desktopTest --stacktrace

      - name: Run iOS shared tests
        run: ./gradlew :shared:iosSimulatorArm64Test --stacktrace

      - name: Build macOS app image without captcha assets
        env:
          DESKTOP_PACKAGE_JAVA_HOME: ${{ env.JAVA_HOME }}
        run: |
          plutil -lint iosApp/iosApp.xcodeproj/project.pbxproj
          ./gradlew :desktopApp:createDistributable --stacktrace
          python3 - <<'PY'
          from pathlib import Path
          app = Path("desktopApp/build/compose/binaries/main/app/BJTUselfServiceKMP.app")
          assert app.is_dir(), "macOS app image missing"
          obsolete = [p for p in app.rglob("*") if "bjtucaptcha" in p.name.lower()]
          assert not obsolete, f"Obsolete captcha files: {obsolete}"
          for part in ("app", "runtime", "Resources"):
              folder = app / "Contents" / part
              size = sum(p.stat().st_size for p in folder.rglob("*") if p.is_file())
              print(f"macOS Contents/{part}: {size:,} bytes")
          PY

      - name: Upload shared test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apple-shared-test-reports
          path: |
            multiplatform/shared/build/test-results/iosSimulatorArm64Test/
            multiplatform/shared/build/test-results/desktopTest/
          if-no-files-found: warn

  windows:
    name: Windows app image check
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: multiplatform
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: gradle/actions/wrapper-validation@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - name: Build Windows app image and report size
        env:
          WINDOWS_PACKAGE_JAVA_HOME: ${{ env.JAVA_HOME }}
        run: |
          .\gradlew.bat :windowsApp:createDistributable --stacktrace
          if ($LASTEXITCODE -ne 0) { throw "Windows app image build failed" }
          $apps = @(Get-ChildItem "windowsApp/build/compose/binaries/main/app" -Directory)
          if ($apps.Count -ne 1) { throw "Expected one Windows app image" }
          $files = @(Get-ChildItem $apps[0].FullName -Recurse -File)
          $obsolete = @($files | Where-Object { $_.Name -match 'BJTUCaptcha|onnxruntime|pytorch' })
          if ($obsolete.Count -gt 0) { throw "Obsolete captcha files in Windows app image" }
          $files | Sort-Object Length -Descending | Select-Object -First 12 @{Name="RelativePath";Expression={$_.FullName.Substring($apps[0].FullName.Length + 1)}}, Length | ConvertTo-Json
          foreach ($part in @("app", "runtime")) {
            $folder = Join-Path $apps[0].FullName $part
            $size = (Get-ChildItem $folder -Recurse -File | Measure-Object Length -Sum).Sum
            Write-Host "Windows ${part}: $size bytes"
          }
          Write-Host "Windows app image total bytes: $(($files | Measure-Object Length -Sum).Sum)"
