name: Gitee Release mirror

on:
  # Explicitly called after kmp-package.yml publishes the GitHub release.
  # GITHUB_TOKEN-created releases do not trigger release: published workflows.
  workflow_call:
    inputs:
      tag:
        description: Existing GitHub Release tag to mirror
        required: true
        type: string
      best_effort:
        description: Keep the calling packaging workflow successful if mirroring fails
        required: false
        default: false
        type: boolean
      promote_test:
        description: Retag the complete authorized v1.0.0-gitee-test mirror to v2.0.0
        required: false
        default: false
        type: boolean
    secrets:
      GITEE_TOKEN:
        required: true
  # Retry a published version without rebuilding any installers or publishing again.
  workflow_dispatch:
    inputs:
      tag:
        description: 要同步的现有 GitHub Release 标签（例如 v1.8.6-KMP）
        required: true
        type: string
      promote_test:
        description: 仅将已完整同步的 v1.0.0-gitee-test 改为 Gitee v2.0.0 测试版
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: gitee-release-mirror
  cancel-in-progress: false

jobs:
  mirror:
    if: ${{ inputs.tag != 'v1.0.0-gitee-test' }}
    name: Mirror published release to Gitee
    runs-on: ubuntu-latest
    # Automatic packaging remains successful; a standalone manual retry reports failures.
    continue-on-error: ${{ inputs.best_effort == true }}
    timeout-minutes: 30
    steps:
      - name: Checkout mirror implementation and tags
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify mirror safety checks
        run: PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s scripts/tests -v
      - name: Mirror notes, tag and four installers; verify anonymous downloads
        id: sync
        env:
          GH_TOKEN: ${{ github.token }}
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          GITEE_USERNAME: ${{ vars.GITEE_USERNAME || 'zjg1225' }}
          RELEASE_TAG: ${{ inputs.tag }}
          PROMOTE_GITEE_TEST: ${{ inputs.promote_test }}
        run: python3 scripts/mirror-gitee-release.py
      - name: Report mirror failure separately
        if: ${{ failure() }}
        run: |
          echo '::warning::Gitee mirror failed. The existing GitHub Release is unchanged. See this job log, fix credentials/quota/network, then run Gitee Release mirror with the same tag.'
          echo 'Gitee mirror failed; the GitHub Release remains available. Fix the error and retry **Gitee Release mirror** for the same tag.' >> "$GITHUB_STEP_SUMMARY"

  test-draft-mirror:
    name: Mirror authorized hidden test release to Gitee
    if: ${{ inputs.tag == 'v1.0.0-gitee-test' }}
    runs-on: ubuntu-latest
    # GitHub only exposes drafts to identities with push access. Ordinary mirrors remain read-only.
    permissions:
      contents: write
    continue-on-error: ${{ inputs.best_effort == true }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify mirror safety checks
        run: PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s scripts/tests -v
      - name: Mirror authorized test and verify anonymous installers
        env:
          GH_TOKEN: ${{ github.token }}
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          GITEE_USERNAME: ${{ vars.GITEE_USERNAME || 'zjg1225' }}
          RELEASE_TAG: ${{ inputs.tag }}
          PROMOTE_GITEE_TEST: ${{ inputs.promote_test }}
        run: python3 scripts/mirror-gitee-release.py
