name: KMP package

on:
  push:
    tags:
      - "v*-KMP*"
      - "v*-Liquid*"
  workflow_dispatch:

concurrency:
  group: kmp-package-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  GRADLE_OPTS: -Dorg.gradle.daemon=false

jobs:
  android:
    name: Android arm64 debug APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: multiplatform
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          # v4 默认还会请求已从新版 SDK 移除的 legacy `tools` 包。
          packages: platform-tools

      - name: Restore Android upload keystore
        env:
          BJTU_ANDROID_KEYSTORE_BASE64: ${{ secrets.BJTU_ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$BJTU_ANDROID_KEYSTORE_BASE64" ]; then
            echo "Missing secret BJTU_ANDROID_KEYSTORE_BASE64"
            exit 1
          fi
          python3 - <<'PY'
          import base64, os, pathlib
          raw = os.environ["BJTU_ANDROID_KEYSTORE_BASE64"]
          path = pathlib.Path.home() / ".android" / "bjtu-kmp-upload.keystore"
          path.parent.mkdir(parents=True, exist_ok=True)
          path.write_bytes(base64.b64decode(raw))
          path.chmod(0o600)
          print(f"keystore_bytes={path.stat().st_size}")
          PY
          echo "BJTU_ANDROID_KEYSTORE=$HOME/.android/bjtu-kmp-upload.keystore" >> "$GITHUB_ENV"

      - name: Build arm64 debug APK
        env:
          BJTU_ANDROID_STORE_PASSWORD: ${{ secrets.BJTU_ANDROID_STORE_PASSWORD }}
          BJTU_ANDROID_KEY_ALIAS: ${{ secrets.BJTU_ANDROID_KEY_ALIAS }}
          BJTU_ANDROID_KEY_PASSWORD: ${{ secrets.BJTU_ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x ./gradlew
          ./gradlew :androidApp:assembleDebug --stacktrace

      - name: Rename APK
        id: artifact
        run: |
          VERSION="$(sed -n 's/.*CURRENT_VERSION = "\([^"]*\)".*/\1/p' shared/src/commonMain/kotlin/team/bjtuss/bjtuselfservice/shared/update/AppUpdateChecker.kt | head -n 1)"
          APK="$(find androidApp/build/outputs/apk/debug -type f -name '*-arm64-v8a-debug.apk' | head -n 1)"
          if [ -z "$APK" ]; then
            echo "arm64-v8a debug APK not found"
            find androidApp/build/outputs/apk/debug -type f -name '*.apk' -print
            exit 1
          fi
          test -n "$VERSION"
          test -f "$APK"
          NAME="BJTUSelfService-KMP-${VERSION}-arm64-v8a.apk"
          cp "$APK" "$NAME"
          echo "file=$NAME" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          ls -lh "$NAME"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: kmp-android-apk
          path: multiplatform/${{ steps.artifact.outputs.file }}
          if-no-files-found: error

  windows:
    name: Windows MSI
    runs-on: windows-latest
    defaults:
      run:
        working-directory: multiplatform
        shell: pwsh
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Check jpackage
        env:
          WINDOWS_PACKAGE_JAVA_HOME: ${{ env.JAVA_HOME }}
        run: |
          $jp = Join-Path $env:JAVA_HOME "bin\jpackage.exe"
          if (-not (Test-Path $jp)) { throw "jpackage missing: $jp" }
          Write-Host "jpackage=$jp"
          & $jp --version
          chcp 65001 | Out-Null

      - name: Build MSI
        env:
          WINDOWS_PACKAGE_JAVA_HOME: ${{ env.JAVA_HOME }}
          WINDOWS_PACKAGE_NAME: BJTUselfServiceKMP
          WINDOWS_PACKAGE_DESCRIPTION: BJTU Self Service KMP
          JAVA_TOOL_OPTIONS: -Dfile.encoding=UTF-8 -Dsun.jnu.encoding=UTF-8
        run: |
          chcp 65001 | Out-Null
          .\gradlew.bat :windowsApp:packageMsi --stacktrace

      - name: Print jpackage logs
        if: failure()
        run: |
          Get-ChildItem -Recurse "windowsApp\build\compose\logs","windowsApp\build\jpackage-shim" -Include *.txt,*.log -ErrorAction SilentlyContinue | ForEach-Object {
            Write-Host "===== $($_.FullName) ====="
            Get-Content -LiteralPath $_.FullName -ErrorAction SilentlyContinue
          }

      - name: Rename MSI
        id: artifact
        run: |
          $version = (Select-String -Path "shared\src\commonMain\kotlin\team\bjtuss\bjtuselfservice\shared\update\AppUpdateChecker.kt" -Pattern 'CURRENT_VERSION = "([^"]+)"').Matches[0].Groups[1].Value
          $msi = Get-ChildItem "windowsApp\build\compose\binaries\main\msi\*.msi" | Select-Object -First 1
          if (-not $msi) { throw "MSI not found" }
          $name = "BJTUselfServiceKMP-$version.msi"
          Copy-Item $msi.FullName $name
          "file=$name" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Get-Item $name | Format-List Name, Length, LastWriteTime

      - name: Upload MSI
        uses: actions/upload-artifact@v4
        with:
          name: kmp-windows-msi
          path: multiplatform/${{ steps.artifact.outputs.file }}
          if-no-files-found: error

  macos:
    name: macOS DMG
    runs-on: macos-15
    timeout-minutes: 60
    defaults:
      run:
        working-directory: multiplatform
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Build macOS DMG
        env:
          DESKTOP_PACKAGE_JAVA_HOME: ${{ env.JAVA_HOME }}
        run: |
          chmod +x ./gradlew
          ./gradlew :desktopApp:packageDmg --stacktrace

      - name: Rename DMG
        id: artifact
        run: |
          VERSION="$(sed -n 's/.*CURRENT_VERSION = "\([^"]*\)".*/\1/p' shared/src/commonMain/kotlin/team/bjtuss/bjtuselfservice/shared/update/AppUpdateChecker.kt | head -n 1)"
          DMG="$(find desktopApp/build/compose/binaries/main/dmg -name '*.dmg' | head -n 1)"
          test -n "$VERSION"
          test -f "$DMG"
          NAME="BJTUselfServiceKMP-${VERSION}.dmg"
          cp "$DMG" "$NAME"
          echo "file=$NAME" >> "$GITHUB_OUTPUT"
          ls -lh "$NAME"

      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: kmp-macos-dmg
          path: multiplatform/${{ steps.artifact.outputs.file }}
          if-no-files-found: error

  ios:
    name: iOS unsigned IPA
    # Compose 1.12 链接 UIViewLayoutRegion，需要 iOS 26 SDK / Xcode 26。
    runs-on: macos-26
    timeout-minutes: 90
    defaults:
      run:
        working-directory: multiplatform
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Select Xcode 26
        run: |
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Build unsigned iOS app
        env:
          JAVA_HOME: ${{ env.JAVA_HOME }}
        run: |
          chmod +x ./gradlew
          xcodebuild \
            -project iosApp/iosApp.xcodeproj \
            -scheme iosApp \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath iosApp/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package IPA
        id: artifact
        run: |
          VERSION="$(sed -n 's/.*CURRENT_VERSION = "\([^"]*\)".*/\1/p' shared/src/commonMain/kotlin/team/bjtuss/bjtuselfservice/shared/update/AppUpdateChecker.kt | head -n 1)"
          APP="$(find iosApp/DerivedData/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' | head -n 1)"
          test -n "$VERSION"
          test -d "$APP"
          NAME="BJTUSelfService-KMP-${VERSION}-iOS-unsigned.ipa"
          rm -rf ipa-stage
          mkdir -p ipa-stage/Payload
          APP_NAME="BJTUselfServiceKMP.app"
          cp -R "$APP" "ipa-stage/Payload/$APP_NAME"
          mv "ipa-stage/Payload/$APP_NAME/交大自由行 KMP" "ipa-stage/Payload/BJTUselfServiceKMP.app/BJTUselfServiceKMP"
          /usr/libexec/PlistBuddy -c 'Set :CFBundleExecutable BJTUselfServiceKMP' "ipa-stage/Payload/$APP_NAME/Info.plist"
          (cd ipa-stage && zip -qry "../$NAME" Payload)
          echo "file=$NAME" >> "$GITHUB_OUTPUT"
          ls -lh "$NAME"

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: kmp-ios-ipa
          path: multiplatform/${{ steps.artifact.outputs.file }}
          if-no-files-found: error

  release:
    name: GitHub Release
    needs: [android, windows, macos, ios]
    if: ${{ startsWith(github.ref, 'refs/tags/v') && needs.android.result == 'success' && needs.windows.result == 'success' && needs.macos.result == 'success' && needs.ios.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release notes
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            docs/releases

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: kmp-*
          merge-multiple: true
          path: dist

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}：交大自由行 KMP 正式版
          prerelease: false
          fail_on_unmatched_files: true
          files: dist/*
          body_path: docs/releases/${{ github.ref_name }}.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
