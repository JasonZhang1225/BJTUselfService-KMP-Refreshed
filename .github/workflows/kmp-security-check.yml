name: KMP security checks

on:
  push:
    branches: [Liquid]
    paths:
      - "multiplatform/**"
      - ".github/workflows/kmp-security-check.yml"
  pull_request:
    paths:
      - "multiplatform/**"
      - ".github/workflows/kmp-security-check.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apple:
    name: iOS compile and macOS security tests
    runs-on: macos-26
    timeout-minutes: 60
    defaults:
      run:
        working-directory: multiplatform
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Select Xcode 26
        run: |
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          xcodebuild -version

      - name: Verify iOS minimum version
        run: |
          for configuration in Debug Release; do
            xcodebuild -project iosApp/iosApp.xcodeproj -scheme iosApp \
              -configuration "$configuration" -sdk iphonesimulator -showBuildSettings |
              grep -Eq '^[[:space:]]*IPHONEOS_DEPLOYMENT_TARGET = 16\.0$'
          done

      - name: Compile iOS and test macOS security paths
        run: |
          chmod +x ./gradlew
          ./gradlew :shared:iosSimulatorArm64Test :shared:desktopTest --stacktrace

      - name: Upload iOS test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-simulator-test-reports
          path: multiplatform/shared/build/test-results/iosSimulatorArm64Test/
          if-no-files-found: warn
