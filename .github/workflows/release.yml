name: Release new version

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-and-release:
    name: Build & Release APK
    # 冻结根 Android 的正式包。KMP 标签走 kmp-package.yml，避免把 v1.7.0 工程打进 KMP Release。
    if: ${{ !contains(github.ref_name, 'KMP') && !contains(github.ref_name, 'Liquid') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Use Google/Maven Central on GitHub runners
        run: python3 .github/ci/rewrite_ci_maven_repos.py

      - name: Build Unsigned Release APK
        run: ./gradlew :app:assembleRelease --init-script .github/ci/github-maven-fallback.init.gradle.kts --stacktrace

      - name: Get Build Tools Version & Rename
        shell: bash
        run: |
          BUILD_TOOLS_VERSION=$(ls /usr/local/lib/android/sdk/build-tools/ | tail -n 1)
          echo "BUILD_TOOLS_VERSION=$BUILD_TOOLS_VERSION" >> $GITHUB_ENV

          mv app/build/outputs/apk/release/app-arm64-v8a-release-unsigned.apk \
             app/build/outputs/apk/release/app-arm64-v8a-release.apk

      - name: Sign APK
        id: sign-apk
        uses: tiann/zipalign-sign-android-release@e76990551f7797c24236f9d39e72b3c49851ea3c # v1.1.4
        with:
          releaseDirectory: app/build/outputs/apk/release
          signingKeyBase64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          alias: ${{ secrets.KEY_ALIAS }}
          keyStorePassword: ${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}
          zipAlign: true
        env:
          BUILD_TOOLS_VERSION: ${{ env.BUILD_TOOLS_VERSION }}

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: ${{ steps.sign-apk.outputs.signedReleaseFile }}

      - name: Get Commit Message for Release Notes
        id: get_commit_message
        shell: bash
        run: |
          COMMIT_MESSAGE_BODY=$(git log -1 --pretty=%b ${{ github.sha }})
          if [ -z "$COMMIT_MESSAGE_BODY" ]; then
            COMMIT_MESSAGE_BODY="该版本的详细更新日志请参见相关的 commit 历史。"
          fi
          echo "release_notes_body<<EOF" >> $GITHUB_OUTPUT
          echo "$COMMIT_MESSAGE_BODY" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Extract Version from Tag
        id: extract_version
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          VERSION_NUMBER=$(echo "$TAG_NAME" | sed 's/^v//')
          echo "version_number=$VERSION_NUMBER" >> $GITHUB_OUTPUT
          echo "Extracted version: $VERSION_NUMBER from tag: $TAG_NAME"

      - name: Create Release
        id: create_release_step
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref_name }}
          release_name: 交大自由行${{ github.ref_name }}
          body: ${{ steps.get_commit_message.outputs.release_notes_body }}
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}

      - name: Upload Release APK
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release_step.outputs.upload_url }}
          asset_path: ${{ steps.sign-apk.outputs.signedReleaseFile }}
          asset_name: BJTUSelfService-${{ steps.extract_version.outputs.version_number }}_arm64-v8a.apk
          asset_content_type: application/vnd.android.package-archive
